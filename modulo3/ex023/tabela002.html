<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
            border: 2px solid black;
            box-shadow: inset 0px 0px 10px rgba(0, 0, 0, 0.437) /*inset (opcional) offset-x (deslocamento horizontal) offset-y (deslocamento vertical) blur-radius (desfoque) spread-radius (propagação da sombra) color*/;
        }

        td {
            border: 1px solid black;
            padding: 5px;
            text-align: center; /* Alinhamento Horizontal */
            vertical-align: top; /* Alinhamento Vertical */
        }
    </style>
</head>
<body>
    <h1>Minha <del>primeira</del> segunda tabela</h1>
    <!--
        HIERARQUIA DE TABELAS (simples):

        1. TABLE = tabela
            2. TABLE ROW (tr) = linha da tabela
                3. TABLE HEADER (th) = cabeçalho da tabela
                3. TABLE DATA (td) = dados databela
    -->
    <table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
        <tr>
            <td>A5</td>
            <td>B5</td>
            <td>C5</td>
        </tr>
        <tr>
            <td>A6</td>
            <td>B6</td>
            <td>C6</td>
        </tr>
        <tr>
            <td>A7</td>
            <td>B7</td>
            <td>C7</td>
        </tr>
        <tr>
            <td>A8</td>
            <td>B8</td>
            <td>C8</td>
        </tr>
    </table>
</body>
</html>
