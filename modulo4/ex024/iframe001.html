<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>
</head>
<body>
    <h1>Testando o uso do Iframe</h1>
    <p>Acessando o site do <a href="https://cursoemvideo.com" target="_blank">Curso em Video</a> para aprender a programar</p>

    <p>
        Acessando o site do 

        <!--  Tamanho padrão do Iframe: 300x150 -->
        <iframe src="https://cursoemvideo.com" frameborder="0" height="600" width="1200"></iframe>

        para aprender a programar
    </p>
    <p>
        O site do Google ->

        <iframe src="https://www.google.com.br" frameborder="0"></iframe>
        
        também é muito legal, mas ele é protegido contra Iframe
    </p>
    <p>
        O site do Google ->

        <iframe src="https://www.google.com.br" frameborder="0">
            <a href="https://www.google.com.br" target="_blank">Google</a>
        </iframe>

        também é muito legal, mas ele é protegido contra Iframe D:
    </p>
</body>
</html>
