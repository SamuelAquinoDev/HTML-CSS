<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Quanto você pega no Levantamento Terra?</h1>

    <form action="cadastro.php">
        <p>
            <label for="inum">Número: </label>
            <input type="range" name="num" id="inum" min="0" max="310" required oninput="ival.innerHTML = Number(inum.value) + 'kg'">
            <output id="ival">0kg</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
